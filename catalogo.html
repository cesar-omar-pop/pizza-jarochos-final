<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Pizza Jarocha</title>

    <!-- ICONOS -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- ESTILOS -->
    <link rel="stylesheet" href="css/style-menu.css">
    <link rel="stylesheet" href="css/styles-catalogo.css">

</head>
<body>

    <!-- ============================= -->
    <!--           HEADER              -->
    <!-- ============================= -->
    <header class="main-header">
        <div class="header-content">

            <div class="logo-title">
                <div class="brand-wrapper">
                    <img src="img/pizza.jpg" alt="Logo Pizza Jarocha" class="header-logo-img">
                    <div class="brand-text-group">
                        <h1 class="brand-name-text">Pizza Jarocha</h1>
                        <span class="slogan">El sabor de Veracruz en tu mesa</span>
                    </div>
                </div>
            </div>

            <a href="admin.html" id="admin-nav-link" class="nav-item" style="display:none;">
                🛠️ Admin
            </a>

            <nav class="main-nav">
                <a href="menu.html" class="nav-item">🏠 Menú</a>

                <a href="notifications.html" class="nav-item" id="notifications-nav-link">
                    <span class="material-icons">notifications</span> Notificaciones
                    <span id="notification-count" class="notification-badge" style="display:none;">0</span>
                </a>

                <a href="catalogo.html" class="nav-item active">📦 Catálogo</a>

                <a href="cart.html" class="nav-item">
                    🛒 Mi pedido
                    <span id="cart-count" class="cart-badge" style="display:none;">0</span>
                </a>

                <a href="reseñas.html" class="nav-item">⭐ Reseñas</a>
            </nav>

            <div class="user-area">
                <span id="user-info">Cargando...</span>
                <button id="logout-button" class="logout-btn">
                    <span class="material-icons">logout</span>
                </button>
            </div>
        </div>
    </header>

    <!-- ============================= -->
    <!--       CONTENIDO PRINCIPAL     -->
    <!-- ============================= -->
    <main class="page-content-wrapper">

        <!-- TABS DE CATEGORÍA -->
        <div class="controls-bar">
            <div class="category-tabs">

                <button class="tab-button" data-category="todo">📦 Todo</button>
                <button class="tab-button" data-category="pizzas">🍕 Pizzas</button>
                <button class="tab-button" data-category="promociones">🔥 Promociones</button>
                <button class="tab-button" data-category="combos">Combos</button>
                <button class="tab-button" data-category="bebidas">Bebidas</button>
                <button class="tab-button" data-category="postres">Postres</button>
                <button class="tab-button" data-category="extras">Extras</button>
            </div>

            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Buscar producto...">
            </div>
        </div>

        <!-- COMBOS / PROMOS -->
        <section id="combos-section" class="featured-section">
            <h2 class="section-title">✨ Combos & Promociones</h2>
            <div id="combos-grid" class="product-grid">
                <p class="loading-message">Cargando combos...</p>
            </div>
        </section>

        <!-- PRODUCTOS -->
        <section id="products-section" class="featured-section">
            <h2 class="section-title">🛒 Productos</h2>
            <div id="products-grid" class="product-grid">
                <p class="loading-message">Cargando catálogo...</p>
            </div>
        </section>

    </main>

    <!-- TOASTS -->
    <div id="toast-container" class="toast-container"></div>

    <footer class="main-footer"></footer>

    <!-- ============================= -->
    <!--       MODAL DETALLE PRODUCTO   -->
    <!-- ============================= -->
    <div id="product-detail-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>

            <div class="modal-body">

                <img id="modal-image" src="" class="modal-product-image">

                <div class="modal-info">
                    <h2 id="modal-name">Nombre</h2>
                    <p id="modal-description" class="modal-description-text"></p>

                    <div id="modal-ingredients-container">
  <h4>Ingredientes principales:</h4>
  <ul id="modal-ingredients-list"></ul>
</div>


                    <div class="modal-footer">
                        <span id="modal-price" class="product-price">$0.00</span>

                        <button id="modal-add-to-cart" class="add-to-cart-btn">
                            <span class="material-icons">add_shopping_cart</span> Añadir
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================= -->
    <!--       SCRIPTS FIREBASE        -->
    <!-- ============================= -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/common.js"></script>
    <script type="module" src="js/catalogo.js"></script>

</body>
</html>
