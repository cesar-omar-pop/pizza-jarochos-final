<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Pizzas Jarochos</title>
    
    <link rel="stylesheet" href="css/style-menu.css"> 
    <link rel="stylesheet" href="css/login.css"> 
    
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body class="login-body">

    <main class="login-container">
        <div class="login-card" id="login-card-main">
            
            <div class="logo-wrapper"> 
                <img src="./img/pizza.jpg" alt="Logo Pizza Jarochos" class="login-logo-img">
            </div>
            
            <h2 class="card-title">¡Bienvenido!</h2>
            <p class="login-slogan">Inicia sesión para ver nuestro delicioso menú.</p>

            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="tu.correo@dominio.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit" id="login-button" class="btn-primary">
                    Iniciar Sesión
                </button>
            </form>
<button id="google-signin-btn" class="btn-google">
    <span class="material-icons">login</span> Iniciar sesión con Google
</button>

            <p class="reset-password-text">
                <a href="#" id="reset-password-btn" class="btn-link">Olvidé mi contraseña</a>
            </p>
            <p class="register-text">
                ¿No tienes cuenta? 
                <a href="#" id="register-btn" class="btn-link">Regístrate aquí</a>
            </p>

            <div id="auth-message" class="auth-message-box"></div>
        </div>
    </main>

    <div id="register-modal" class="modal-overlay">
        <div class="login-card modal-content">
            <span class="close-button">&times;</span>
            
            <div class="logo-wrapper"> 
                <img src="./img/pizza.jpg" alt="Logo Pizza Jarochos" class="login-logo-img">
            </div>

            <h2 class="card-title">Crear Cuenta</h2>
            <p class="login-slogan">Únete a la familia Jarocha y ordena tus pizzas favoritas.</p>

            <form id="register-form-modal" class="login-form">
                <div class="form-group">
                    <label for="new-email">Correo Electrónico</label>
                    <input type="email" id="new-email" name="new-email" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="form-group">
                    <label for="new-password">Contraseña</label>
                    <input type="password" id="new-password" name="new-password" placeholder="Mínimo 6 caracteres" required>
                </div>

                <button type="submit" class="btn-primary">
                    Registrarse
                </button>
            </form>
            <div id="modal-error-message" class="auth-message-box"></div>
        </div>
    </div>

    <div id="reset-modal" class="modal-overlay">
        <div class="login-card modal-content">
            <span class="close-button" id="close-reset-modal">&times;</span>
            
            <div class="logo-wrapper"> 
                <img src="./img/pizza.jpg" alt="Logo Pizza Jarochos" class="login-logo-img">
            </div>

            <h2 class="card-title">Recuperar Contraseña</h2>
            <p class="login-slogan">Ingresa tu correo para enviarte un enlace de restablecimiento.</p>

            <form id="reset-form-modal" class="login-form">
                <div class="form-group">
                    <label for="reset-email">Correo Electrónico</label>
                    <input type="email" id="reset-email" name="reset-email" placeholder="tu.correo@dominio.com" required>
                </div>

                <button type="submit" id="reset-button-modal" class="btn-primary">
                    Enviar Enlace
                </button>
            </form>
            <div id="reset-message-box" class="auth-message-box"></div>
        </div>
    </div>


    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/auth-guard.js"></script>
</body>
</html>
